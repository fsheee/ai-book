# Content Schema for Humanoid Robotics Chapter 2
# Defines the structure for chapter content in Docusaurus

version: "1.0.0"
date: "2025-11-30"

# Chapter Structure
Chapter:
  type: object
  required:
    - id
    - title
    - slug
    - order
    - description
    - learning_outcomes
    - sections
  properties:
    id:
      type: integer
      minimum: 1
      description: "Unique chapter identifier"
      example: 2
    title:
      type: string
      minLength: 3
      maxLength: 100
      description: "Chapter title"
      example: "Kinematics and Dynamics"
    slug:
      type: string
      pattern: "^[a-z0-9-]+$"
      description: "URL-friendly identifier"
      example: "kinematics-dynamics"
    order:
      type: integer
      minimum: 1
      description: "Display order in navigation"
      example: 2
    description:
      type: string
      maxLength: 500
      description: "Brief chapter overview"
      example: "Explore the mathematical foundations of humanoid robot motion and forces."
    learning_outcomes:
      type: array
      minItems: 3
      maxItems: 10
      items:
        type: string
      description: "List of learning objectives"
      example:
        - "Define forward and inverse kinematics for humanoid arms"
        - "Apply DH parameters to describe robot geometry"
    prerequisites:
      type: array
      items:
        type: integer
      description: "IDs of prerequisite chapters"
      example: [1]
    estimated_time:
      type: integer
      minimum: 5
      description: "Estimated reading time in minutes"
      example: 45
    sections:
      type: array
      items:
        $ref: "#/Section"
      description: "Ordered list of sections"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Section Structure
Section:
  type: object
  required:
    - id
    - chapter_id
    - title
    - slug
    - order
    - content
  properties:
    id:
      type: string
      description: "Unique section identifier"
      example: "ch2-forward-kinematics"
    chapter_id:
      type: integer
      description: "Parent chapter ID"
      example: 2
    title:
      type: string
      minLength: 3
      maxLength: 150
      description: "Section title"
      example: "Forward Kinematics"
    slug:
      type: string
      pattern: "^[a-z0-9-]+$"
      description: "URL-friendly identifier"
      example: "forward-kinematics"
    order:
      type: integer
      minimum: 1
      description: "Display order within chapter"
    content:
      type: string
      minLength: 100
      description: "Full section content in Markdown/MDX"
    subsections:
      type: array
      items:
        $ref: "#/Subsection"
      description: "Ordered list of subsections"
    difficulty:
      type: string
      enum: ["beginner", "intermediate", "advanced"]
      description: "Content difficulty level"
      example: "intermediate"
    tags:
      type: array
      items:
        type: string
      description: "Topic tags for search/filtering"
      example: ["kinematics", "dh-parameters"]
    code_examples:
      type: array
      items:
        $ref: "#/CodeExample"
    diagrams:
      type: array
      items:
        $ref: "#/Diagram"

# Subsection Structure
Subsection:
  type: object
  required:
    - id
    - section_id
    - title
    - order
    - content
  properties:
    id:
      type: string
      example: "ch2-fk-dh-parameters"
    section_id:
      type: string
      example: "ch2-forward-kinematics"
    title:
      type: string
      example: "Denavit-Hartenberg Parameters"
    order:
      type: integer
      minimum: 1
    content:
      type: string
      minLength: 50
    anchor:
      type: string
      pattern: "^[a-z0-9-]+$"
      description: "HTML anchor ID for deep linking"
      example: "dh-parameters"

# Code Example Structure
CodeExample:
  type: object
  required:
    - id
    - section_id
    - title
    - language
    - code
  properties:
    id:
      type: string
      example: "ch2-fk-2dof-python"
    section_id:
      type: string
      example: "ch2-forward-kinematics"
    title:
      type: string
      maxLength: 200
      example: "2-DOF Planar Arm Forward Kinematics"
    language:
      type: string
      enum: ["python", "cpp", "javascript", "bash", "yaml"]
      description: "Programming language"
      example: "python"
    code:
      type: string
      description: "Source code content"
      example: |
        import numpy as np

        def forward_kinematics(theta1, theta2, l1, l2):
            x = l1 * np.cos(theta1) + l2 * np.cos(theta1 + theta2)
            y = l1 * np.sin(theta1) + l2 * np.sin(theta1 + theta2)
            return x, y
    explanation:
      type: string
      maxLength: 1000
      description: "Brief explanation of the code"
    runnable:
      type: boolean
      default: false
      description: "Whether code can be executed in browser"
    dependencies:
      type: array
      items:
        type: string
      description: "Required libraries"
      example: ["numpy", "matplotlib"]

# Diagram Structure
Diagram:
  type: object
  required:
    - id
    - section_id
    - title
    - type
    - source
  properties:
    id:
      type: string
      example: "ch2-2dof-arm-diagram"
    section_id:
      type: string
      example: "ch2-forward-kinematics"
    title:
      type: string
      maxLength: 200
      example: "2-DOF Planar Arm Coordinate Frames"
    type:
      type: string
      enum: ["static_image", "interactive", "mermaid", "latex"]
      description: "Diagram type"
      example: "static_image"
    source:
      type: string
      description: "Diagram source (file path, Mermaid code, LaTeX, etc.)"
      example: "/img/chapter2/2dof-arm.svg"
    alt_text:
      type: string
      maxLength: 500
      description: "Accessibility description"
      example: "Diagram showing two-link planar arm with coordinate frames at joints"
    caption:
      type: string
      maxLength: 500
      description: "Figure caption"
      example: "Figure 2.1: Coordinate frame assignment for a 2-DOF planar arm"

# Frontmatter for MDX files
Frontmatter:
  type: object
  description: "Metadata at the top of each .md/.mdx file"
  required:
    - title
    - sidebar_position
  properties:
    title:
      type: string
      description: "Page title (appears in browser tab and navigation)"
      example: "Forward Kinematics"
    sidebar_position:
      type: integer
      minimum: 1
      description: "Order in sidebar navigation"
      example: 1
    description:
      type: string
      maxLength: 300
      description: "Page description for SEO"
      example: "Learn about forward kinematics for humanoid robots using DH parameters."
    keywords:
      type: array
      items:
        type: string
      description: "SEO keywords"
      example: ["forward kinematics", "DH parameters", "humanoid robotics"]
    tags:
      type: array
      items:
        type: string
      description: "Content tags"
      example: ["kinematics", "theory"]
    difficulty:
      type: string
      enum: ["beginner", "intermediate", "advanced"]
      example: "intermediate"
    estimated_time:
      type: integer
      description: "Estimated reading time in minutes"
      example: 15

