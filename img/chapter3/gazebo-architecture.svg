<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gazebo Architecture</text>

  <!-- Server Layer -->
  <rect x="50" y="60" width="500" height="100" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="300" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Gazebo Server (gz-sim)</text>
  <text x="300" y="115" font-size="12" text-anchor="middle" fill="white">Physics Engine • Sensor Manager • Entity Manager</text>
  <text x="300" y="135" font-size="12" text-anchor="middle" fill="white">Runs headless • Handles simulation state</text>

  <!-- Client Layer -->
  <rect x="50" y="190" width="500" height="80" fill="#50C878" stroke="#2E8B57" stroke-width="2" rx="5"/>
  <text x="300" y="215" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Gazebo Client (gz-sim GUI)</text>
  <text x="300" y="240" font-size="12" text-anchor="middle" fill="white">3D Visualization • User Interface • Scene Rendering</text>

  <!-- Plugin Layer -->
  <rect x="50" y="300" width="500" height="80" fill="#FF8C42" stroke="#CC6633" stroke-width="2" rx="5"/>
  <text x="300" y="325" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Plugins</text>
  <text x="120" y="350" font-size="11" text-anchor="middle" fill="white">Sensors</text>
  <text x="240" y="350" font-size="11" text-anchor="middle" fill="white">Controllers</text>
  <text x="360" y="350" font-size="11" text-anchor="middle" fill="white">ROS 2 Bridge</text>
  <text x="480" y="350" font-size="11" text-anchor="middle" fill="white">Custom Logic</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#666"/>
    </marker>
  </defs>

  <!-- Server to Client arrow -->
  <line x1="300" y1="160" x2="300" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="175" font-size="10" fill="#666">State updates</text>

  <!-- Client to Server arrow -->
  <line x1="320" y1="185" x2="320" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="175" font-size="10" fill="#666">Commands</text>

  <!-- Server to Plugin arrow -->
  <line x1="300" y1="270" x2="300" y2="295" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="285" font-size="10" fill="#666">Plugin API</text>
</svg>