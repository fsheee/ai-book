<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <!-- Title -->
  <text x="350" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Isaac Sim Workflow</text>

  <!-- Stage 1: Design -->
  <rect x="50" y="70" width="150" height="80" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="125" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1. Design Robot</text>
  <text x="125" y="125" font-size="11" text-anchor="middle" fill="white">URDF/USD model</text>
  <text x="125" y="140" font-size="11" text-anchor="middle" fill="white">+ Sensors</text>

  <!-- Stage 2: Import -->
  <rect x="275" y="70" width="150" height="80" fill="#50C878" stroke="#2E8B57" stroke-width="2" rx="5"/>
  <text x="350" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2. Import to</text>
  <text x="350" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Isaac Sim</text>
  <text x="350" y="135" font-size="11" text-anchor="middle" fill="white">Omniverse USD</text>

  <!-- Stage 3: Configure -->
  <rect x="500" y="70" width="150" height="80" fill="#FF8C42" stroke="#CC6633" stroke-width="2" rx="5"/>
  <text x="575" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3. Configure</text>
  <text x="575" y="115" font-size="11" text-anchor="middle" fill="white">PhysX 5 physics</text>
  <text x="575" y="130" font-size="11" text-anchor="middle" fill="white">Domain random.</text>
  <text x="575" y="145" font-size="11" text-anchor="middle" fill="white">RTX rendering</text>

  <!-- Stage 4: Simulate -->
  <rect x="50" y="200" width="150" height="80" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="5"/>
  <text x="125" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4. Simulate</text>
  <text x="125" y="250" font-size="11" text-anchor="middle" fill="white">GPU-accelerated</text>
  <text x="125" y="265" font-size="11" text-anchor="middle" fill="white">1000+ parallel envs</text>

  <!-- Stage 5: Collect Data -->
  <rect x="275" y="200" width="150" height="80" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="350" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="white">5. Collect Data</text>
  <text x="350" y="250" font-size="11" text-anchor="middle" fill="white">RGB, depth, labels</text>
  <text x="350" y="265" font-size="11" text-anchor="middle" fill="white">Replicator API</text>

  <!-- Stage 6: Train -->
  <rect x="500" y="200" width="150" height="80" fill="#1ABC9C" stroke="#16A085" stroke-width="2" rx="5"/>
  <text x="575" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="white">6. Train RL</text>
  <text x="575" y="250" font-size="11" text-anchor="middle" fill="white">Isaac Gym</text>
  <text x="575" y="265" font-size="11" text-anchor="middle" fill="white">Stable-Baselines3</text>

  <!-- Stage 7: Deploy -->
  <rect x="275" y="330" width="150" height="80" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="5"/>
  <text x="350" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="white">7. Deploy</text>
  <text x="350" y="380" font-size="11" text-anchor="middle" fill="white">Physical robot</text>
  <text x="350" y="395" font-size="11" text-anchor="middle" fill="white">or production sim</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#666"/>
    </marker>
  </defs>

  <!-- Design → Import -->
  <line x1="200" y1="110" x2="270" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Import → Configure -->
  <line x1="425" y1="110" x2="495" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Configure → Simulate -->
  <line x1="575" y1="150" x2="575" y2="170" x2="200" y2="170" x2="200" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Simulate → Collect Data -->
  <line x1="200" y1="240" x2="270" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Collect Data → Train -->
  <line x1="425" y1="240" x2="495" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Train → Deploy -->
  <line x1="575" y1="280" x2="575" y2="300" x2="425" y2="300" x2="425" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Feedback loop: Deploy → Simulate (dashed) -->
  <line x1="275" y1="370" x2="50" y2="370" x2="50" y2="240" x2="50" y2="240" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead3)"/>
  <text x="30" y="300" font-size="10" fill="#666" transform="rotate(-90 30 300)">Iterate</text>
</svg>