<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <!-- Title -->
  <text x="350" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">ROS 2 Computation Graph</text>

  <!-- Node 1: Robot Controller -->
  <rect x="50" y="60" width="180" height="80" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="140" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Robot Controller</text>
  <text x="140" y="110" font-size="11" text-anchor="middle" fill="white">Node</text>

  <!-- Node 2: Camera -->
  <rect x="50" y="220" width="180" height="80" fill="#50C878" stroke="#2E8B57" stroke-width="2" rx="5"/>
  <text x="140" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Camera Driver</text>
  <text x="140" y="270" font-size="11" text-anchor="middle" fill="white">Node</text>

  <!-- Node 3: Motion Planner -->
  <rect x="470" y="60" width="180" height="80" fill="#FF8C42" stroke="#CC6633" stroke-width="2" rx="5"/>
  <text x="560" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Motion Planner</text>
  <text x="560" y="110" font-size="11" text-anchor="middle" fill="white">Node</text>

  <!-- Node 4: Logger -->
  <rect x="470" y="220" width="180" height="80" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="5"/>
  <text x="560" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Logger</text>
  <text x="560" y="270" font-size="11" text-anchor="middle" fill="white">Node</text>

  <!-- Topic 1: joint_states -->
  <ellipse cx="350" cy="100" rx="80" ry="30" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <text x="350" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">/joint_states</text>
  <text x="350" y="115" font-size="10" text-anchor="middle" fill="#333">Topic</text>

  <!-- Topic 2: camera/image -->
  <ellipse cx="350" cy="260" rx="80" ry="30" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <text x="350" y="260" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">/camera/image</text>
  <text x="350" y="275" font-size="10" text-anchor="middle" fill="#333">Topic</text>

  <!-- Service -->
  <rect x="260" y="360" width="180" height="60" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="350" y="385" font-size="12" font-weight="bold" text-anchor="middle" fill="white">/plan_motion</text>
  <text x="350" y="405" font-size="10" text-anchor="middle" fill="white">Service</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#666"/>
    </marker>
  </defs>

  <!-- Robot Controller publishes to joint_states -->
  <line x1="230" y1="100" x2="270" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="250" y="90" font-size="9" fill="#666">pub</text>

  <!-- Motion Planner subscribes to joint_states -->
  <line x1="430" y1="100" x2="470" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="450" y="90" font-size="9" fill="#666">sub</text>

  <!-- Camera publishes to camera/image -->
  <line x1="230" y1="260" x2="270" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="250" y="250" font-size="9" fill="#666">pub</text>

  <!-- Logger subscribes to camera/image -->
  <line x1="430" y1="260" x2="470" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="450" y="250" font-size="9" fill="#666">sub</text>

  <!-- Robot Controller calls service -->
  <line x1="140" y1="140" x2="300" y2="360" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
  <text x="200" y="240" font-size="9" fill="#666">service call</text>

  <!-- Motion Planner provides service -->
  <line x1="560" y1="140" x2="400" y2="360" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
  <text x="480" y="240" font-size="9" fill="#666">service</text>

  <!-- Legend -->
  <text x="50" y="470" font-size="11" font-weight="bold" fill="#333">Legend:</text>
  <ellipse cx="120" cy="465" rx="30" ry="12" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  <text x="160" y="470" font-size="10" fill="#666">Topic (pub/sub)</text>

  <rect x="270" y="455" width="50" height="20" fill="#E74C3C" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="330" y="470" font-size="10" fill="#666">Service (req/res)</text>

  <line x1="450" y1="465" x2="490" y2="465" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="500" y="470" font-size="10" fill="#666">Message flow</text>
</svg>