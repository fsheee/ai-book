<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <!-- Title -->
  <text x="350" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Physics Engine Comparison</text>

  <!-- Headers -->
  <rect x="50" y="50" width="200" height="40" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  <text x="150" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Feature</text>

  <rect x="250" y="50" width="140" height="40" fill="#50C878" stroke="#2E8B57" stroke-width="2"/>
  <text x="320" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ODE</text>

  <rect x="390" y="50" width="140" height="40" fill="#FF8C42" stroke="#CC6633" stroke-width="2"/>
  <text x="460" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Bullet</text>

  <rect x="530" y="50" width="140" height="40" fill="#9B59B6" stroke="#7D3C98" stroke-width="2"/>
  <text x="600" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="white">DART</text>

  <!-- Speed -->
  <rect x="50" y="90" width="200" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="120" font-size="12" fill="#333">Speed</text>

  <rect x="250" y="90" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="120" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐</text>

  <rect x="390" y="90" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="460" y="120" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐⭐</text>

  <rect x="530" y="90" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="120" font-size="12" text-anchor="middle" fill="#333">⭐⭐</text>

  <!-- Stability -->
  <rect x="50" y="140" width="200" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="170" font-size="12" fill="#333">Stability</text>

  <rect x="250" y="140" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="170" font-size="12" text-anchor="middle" fill="#333">⭐⭐</text>

  <rect x="390" y="140" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="460" y="170" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐</text>

  <rect x="530" y="140" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="170" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐⭐</text>

  <!-- Humanoid Support -->
  <rect x="50" y="190" width="200" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="220" font-size="12" fill="#333">Humanoid Support</text>

  <rect x="250" y="190" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="220" font-size="12" text-anchor="middle" fill="#333">⭐⭐</text>

  <rect x="390" y="190" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="460" y="220" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐</text>

  <rect x="530" y="190" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="220" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐⭐⭐</text>

  <!-- Contact Accuracy -->
  <rect x="50" y="240" width="200" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="270" font-size="12" fill="#333">Contact Accuracy</text>

  <rect x="250" y="240" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="270" font-size="12" text-anchor="middle" fill="#333">⭐⭐</text>

  <rect x="390" y="240" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="460" y="270" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐</text>

  <rect x="530" y="240" width="140" height="50" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="270" font-size="12" text-anchor="middle" fill="#333">⭐⭐⭐⭐</text>

  <!-- Best For -->
  <rect x="50" y="290" width="200" height="70" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="330" font-size="12" fill="#333">Best For</text>

  <rect x="250" y="290" width="140" height="70" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="320" font-size="10" text-anchor="middle" fill="#333">Simple</text>
  <text x="320" y="335" font-size="10" text-anchor="middle" fill="#333">prototypes</text>

  <rect x="390" y="290" width="140" height="70" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="460" y="320" font-size="10" text-anchor="middle" fill="#333">General</text>
  <text x="460" y="335" font-size="10" text-anchor="middle" fill="#333">robotics</text>

  <rect x="530" y="290" width="140" height="70" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="320" font-size="10" text-anchor="middle" fill="#333">Humanoids &</text>
  <text x="600" y="335" font-size="10" text-anchor="middle" fill="#333">complex contact</text>

  <!-- Legend -->
  <text x="50" y="380" font-size="10" fill="#666">⭐ = Poor  ⭐⭐⭐ = Good  ⭐⭐⭐⭐⭐ = Excellent</text>
</svg>