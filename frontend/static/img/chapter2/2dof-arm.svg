<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Base -->
  <circle cx="50" cy="200" r="8" fill="#333"/>

  <!-- Link 1 -->
  <line x1="50" y1="200" x2="150" y2="100" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <!-- Joint 1 -->
  <circle cx="50" cy="200" r="12" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="30" y="230" font-family="Arial" font-size="14" fill="#dc2626">θ₁</text>

  <!-- Link 2 -->
  <line x1="150" y1="100" x2="280" y2="80" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>

  <!-- Joint 2 -->
  <circle cx="150" cy="100" r="12" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="130" y="130" font-family="Arial" font-size="14" fill="#dc2626">θ₂</text>

  <!-- End-effector -->
  <circle cx="280" cy="80" r="8" fill="#f59e0b"/>
  <text x="290" y="85" font-family="Arial" font-size="14" fill="#f59e0b">End-effector</text>

  <!-- Coordinate frame at base -->
  <line x1="50" y1="200" x2="90" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="95" y="205" font-family="Arial" font-size="12" fill="#dc2626">x₀</text>
  <line x1="50" y1="200" x2="50" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="55" y="155" font-family="Arial" font-size="12" fill="#16a34a">y₀</text>

  <!-- Labels -->
  <text x="90" y="145" font-family="Arial" font-size="14" fill="#2563eb">l₁</text>
  <text x="210" y="70" font-family="Arial" font-size="14" fill="#16a34a">l₂</text>
  <text x="150" y="30" font-family="Arial" font-size="16" font-weight="bold">2-DOF Planar Arm</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
