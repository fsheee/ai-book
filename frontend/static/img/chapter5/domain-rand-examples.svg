<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Domain Randomization Examples</text>

  <!-- Panel 1: Lighting Variation -->
  <rect x="30" y="60" width="170" height="170" fill="#2C3E50" stroke="#333" stroke-width="2"/>
  <text x="115" y="85" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Bright Lighting</text>
  <circle cx="115" cy="140" r="40" fill="#FFD700"/>
  <rect x="75" y="160" width="80" height="50" fill="#95A5A6"/>
  <text x="115" y="220" font-size="10" text-anchor="middle" fill="white">Intensity: 3000 lux</text>

  <!-- Panel 2: Dim Lighting -->
  <rect x="230" y="60" width="170" height="170" fill="#1A252F" stroke="#333" stroke-width="2"/>
  <text x="315" y="85" font-size="12" font-weight="bold" text-anchor="middle" fill="#ccc">Dim Lighting</text>
  <circle cx="315" cy="140" r="40" fill="#666"/>
  <rect x="275" y="160" width="80" height="50" fill="#34495E"/>
  <text x="315" y="220" font-size="10" text-anchor="middle" fill="#ccc">Intensity: 500 lux</text>

  <!-- Panel 3: Texture Variation (Rough) -->
  <rect x="430" y="60" width="170" height="170" fill="#ECF0F1" stroke="#333" stroke-width="2"/>
  <text x="515" y="85" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Rough Texture</text>
  <rect x="475" y="100" width="80" height="100" fill="#95A5A6" stroke="#666" stroke-width="1"/>
  <!-- Add texture pattern -->
  <circle cx="480" cy="110" r="2" fill="#666"/>
  <circle cx="490" cy="115" r="2" fill="#666"/>
  <circle cx="500" cy="108" r="2" fill="#666"/>
  <circle cx="510" cy="120" r="2" fill="#666"/>
  <circle cx="520" cy="112" r="2" fill="#666"/>
  <circle cx="530" cy="118" r="2" fill="#666"/>
  <circle cx="540" cy="105" r="2" fill="#666"/>
  <circle cx="550" cy="125" r="2" fill="#666"/>
  <text x="515" y="220" font-size="10" text-anchor="middle" fill="#333">Friction: 1.5</text>

  <!-- Panel 4: Smooth Texture -->
  <rect x="630" y="60" width="170" height="170" fill="#F8F9FA" stroke="#333" stroke-width="2"/>
  <text x="715" y="85" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Smooth Texture</text>
  <rect x="675" y="100" width="80" height="100" fill="#BDC3C7" stroke="#666" stroke-width="1"/>
  <text x="715" y="220" font-size="10" text-anchor="middle" fill="#333">Friction: 0.3</text>

  <!-- Panel 5: High Mass -->
  <rect x="30" y="260" width="170" height="170" fill="#E8F5E9" stroke="#333" stroke-width="2"/>
  <text x="115" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Heavy Robot</text>
  <rect x="75" y="310" width="80" height="90" fill="#4CAF50"/>
  <text x="115" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="white">80kg</text>
  <line x1="115" y1="385" x2="115" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowdown)"/>
  <text x="115" y="420" font-size="10" text-anchor="middle" fill="#333">High inertia</text>

  <!-- Panel 6: Low Mass -->
  <rect x="230" y="260" width="170" height="170" fill="#FFF3E0" stroke="#333" stroke-width="2"/>
  <text x="315" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Light Robot</text>
  <rect x="285" y="320" width="60" height="70" fill="#FF9800"/>
  <text x="315" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="white">50kg</text>
  <line x1="315" y1="375" x2="315" y2="385" stroke="#333" stroke-width="2" marker-end="url(#arrowdown)"/>
  <text x="315" y="420" font-size="10" text-anchor="middle" fill="#333">Low inertia</text>

  <!-- Panel 7: Camera Noise -->
  <rect x="430" y="260" width="170" height="170" fill="#FFF" stroke="#333" stroke-width="2"/>
  <text x="515" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Noisy Camera</text>
  <!-- Simulate noise with random dots -->
  <rect x="475" y="300" width="80" height="80" fill="#ddd"/>
  <circle cx="480" cy="310" r="1" fill="#000"/>
  <circle cx="495" cy="315" r="1" fill="#000"/>
  <circle cx="510" cy="308" r="1" fill="#000"/>
  <circle cx="525" cy="320" r="1" fill="#000"/>
  <circle cx="540" cy="312" r="1" fill="#000"/>
  <circle cx="485" cy="330" r="1" fill="#000"/>
  <circle cx="500" cy="340" r="1" fill="#000"/>
  <circle cx="520" cy="335" r="1" fill="#000"/>
  <circle cx="545" cy="345" r="1" fill="#000"/>
  <text x="515" y="420" font-size="10" text-anchor="middle" fill="#333">SNR: 20 dB</text>

  <!-- Panel 8: Clean Camera -->
  <rect x="630" y="260" width="170" height="170" fill="#FFF" stroke="#333" stroke-width="2"/>
  <text x="715" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Clean Camera</text>
  <rect x="675" y="300" width="80" height="80" fill="#F0F0F0"/>
  <text x="715" y="420" font-size="10" text-anchor="middle" fill="#333">SNR: 40 dB</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowdown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="30" y="470" font-size="11" font-weight="bold" fill="#333">Purpose: Train robust policies that transfer to real world by exposing to diverse conditions</text>
</svg>