# Optional: Automated Railway deployment via GitHub Actions
# Note: Railway auto-deploys on git push by default, this is for advanced CI/CD

name: Backend Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

